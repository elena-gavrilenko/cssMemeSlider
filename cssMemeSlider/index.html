<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>CssMemeSlider</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="header__title">CSS Meme Slider</h1>
      </header>
      <main class="main">
        <div class="images">
          <img
            class="images__meme images__meme-one"
            src="/images/slide1.jpg"
            alt="meme"
          />
          <img
            class="images__meme images__meme-two"
            src="/images/slide2.jpg"
            alt="meme"
          />
          <img
            class="images__meme images__meme-three"
            src="/images/slide3.jpg"
            alt="meme"
          />
          <img
            class="images__meme images__meme-four"
            src="/images/slide4.jpg"
            alt="meme"
          />
          <img
            class="images__meme images__meme-five"
            src="/images/slide4.jpg"
            alt="meme"
          />
        </div>
      </main>
      <footer class="footer">
        <div class="footer__text"></div>
        <div class="footer__radio-group">
          <input
            class="footer__radio-item-one"
            type="radio"
            name="one"
            id="one"
          />
          <input
            class="footer__radio-item-two"
            type="radio"
            name="two"
            id="two"
          />
          <input
            class="footer__radio-item-three"
            type="radio"
            name="three"
            id="three"
          />
          <input
            class="footer__radio-item-four"
            type="radio"
            name="four"
            id="four"
          />
          <input
            class="footer__radio-item-five"
            type="radio"
            name="five"
            id="five"
          />
        </div>
      </footer>
    </div>
  </body>
</html>
